<!doctype html><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:896px; height:504px; overflow:hidden; background:#000; }
  .stage { position:relative; width:896px; height:504px;
           background:#3a3125; font-family:"Segoe UI",system-ui,sans-serif; }

  /* Packed-earth ground with the tile rhythm RimWorld reads by. */
  .ground { position:absolute; inset:0;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(0deg,  rgba(0,0,0,.16) 0 1px, transparent 1px 64px),
      radial-gradient(120% 90% at 78% 44%, #6d5b3f 0%, #4a3d2c 38%, #2b2419 72%, #1c1710 100%);
  }
  /* The pool is emitted, and anchored on the lantern frame rather than on the whole
     piece: x76 y71 is the opening in the sprite, not its centre of mass. Before the
     Renew release this sat at 50% height and stood for a light source off-frame,
     because the piece gave off none. It does now. */
  .pool { position:absolute; inset:0;
    background: radial-gradient(40% 48% at 76% 71%,
      rgba(224,156,52,.50) 0%, rgba(203,130,40,.22) 44%, rgba(198,126,38,0) 74%); }

  .piece { position:absolute; left:596px; top:96px; width:166px; height:321px;
           image-rendering:auto; filter:drop-shadow(0 10px 10px rgba(0,0,0,.55)); }
  .contact { position:absolute; left:588px; top:396px; width:184px; height:44px;
             background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.62) 0%, rgba(0,0,0,0) 70%); }

  /* Repository standard: radial darkening from the top-left, nil at 74%. */
  .veil { position:absolute; inset:0;
    background: radial-gradient(circle at 0% 0%, rgb(from var(--veil) r g b / .86) 0%, rgb(from var(--veil) r g b / 0) 74%); }

  .text { position:absolute; left:50px; top:54px; width:430px; }
  h1 { font-size:46px; line-height:1.1; font-weight:600; color:var(--inkPrimary); letter-spacing:0; }
  h1 span { font-size:.65em; color:var(--inkSecondary); }
  .tag { font-size:24px; line-height:1.1; font-weight:400; letter-spacing:.2px; color:var(--inkSecondary); margin-top:8px; }
  h1,.tag,p { text-shadow:0 3px 10px rgba(0,0,0,.75); }
  .rule { width:58px; height:3px; background:var(--accent); margin:20px 0 16px; }
  p { font-size:21px; line-height:1.45; color:var(--inkPrimary); }
  .badge { position:absolute; right:0; top:0; width:80px; height:80px; background:var(--accent); clip-path:polygon(0 0,100% 0,100% 100%); }
  .version { position:absolute; left:869px; top:27px; transform:translate(-50%,-50%) rotate(45deg); font-size:26px; line-height:1; font-weight:700; color:var(--badgeInk); }
  html.source .text,html.source .badge,html.source .version,html.source .veil { display:none; }
  html.background .text,html.background .badge,html.background .version { display:none; }
</style>
<div class="stage">
  <div class="ground"></div>
  <div class="pool"></div>
  <div class="contact"></div>
  <img class="piece" src="sprite-trimmed.png">
  <div class="veil"></div>
  <div class="badge"></div><div class="version">1.6</div>
  <div class="text">
    <h1>Fox Lamp <span>Renew</span></h1>
    <div class="tag">(unofficial)</div>
    <div class="rule"></div>
    <p>A bamboo shoot carved from marble, set in an open lantern frame.</p>
  </div>
</div>
<script>
window.ready = (async () => {
  const palette = await (await fetch('preview-palette.json')).json();
  for (const [key,value] of Object.entries(palette)) document.documentElement.style.setProperty('--'+key,value);
  document.documentElement.className = new URLSearchParams(location.search).get('mode') || '';
  await document.fonts.ready;
  await Promise.all([...document.images].map(img => img.decode()));
})();
</script>
